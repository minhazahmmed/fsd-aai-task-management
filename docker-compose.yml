services:
  # 1. MySQL Database Service
  mysql_db:
    image: mysql:8.0
    container_name: task_mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: task_management
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # 2. Express Backend Service
  backend:
    build: ./backend
    container_name: task_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_HOST: mysql_db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: task_management
    depends_on:
      - mysql_db

  # 3. React Frontend Service
  frontend:
    build: ./frontend
    container_name: task_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data: